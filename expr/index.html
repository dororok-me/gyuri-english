:root{--bg:#fff;--ink:#26303a;--muted:#7a8590;--line:#e6eaee;--soft:#f4f6f8;--accent:#ff7a45;--hl:#2f8cff;color-scheme:light}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:10px 16px 14px;box-sizing:border-box;gap:10px}

.who{font-size:12px;color:var(--muted)}
.line{font-size:clamp(22px,6.2vw,28px);font-weight:700;line-height:1.3}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button{font:inherit;font-size:16px;font-weight:600;border-radius:14px;padding:13px 8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
.btns button small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.btns button.on{background:var(--ink);color:#fff;border-color:var(--ink)} .btns button.on small{color:#cfd6dc}
.btns button:disabled{opacity:.5}
.btns .wide{grid-column:1/-1}
button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
</style>

  const top=u=>-0.02*hw*Math.pow(u,4)-rd*D*0.4*(1-u*u)+SAG*(1-u*u);
  const bot=u=>top(u)+D*Math.sqrt(Math.max(0,1-u*u));
  if(D<5){c.beginPath();for(let i=0;i<=N;i++){const u=-1+2*i/N,x=u*hw,y=Math.max(4,hw*0.05)*(1-u*u)+SAG*(1-u*u);i?c.lineTo(x,y):c.moveTo(x,y);}
    c.strokeStyle=G.inner;c.lineWidth=Math.max(5,hw*0.05);c.lineCap='round';c.stroke();c.restore();return;}
  const P=new Path2D();
  for(let i=0;i<=N;i++){const u=-1+2*i/N;i?P.lineTo(u*hw,top(u)):P.moveTo(u*hw,top(u));}
  for(let i=N;i>=0;i--){const u=-1+2*i/N;P.lineTo(u*hw,bot(u));}
  P.closePath();
  const gr=c.createLinearGradient(0,0,0,D+SAG);gr.addColorStop(0,'#5e0d12');gr.addColorStop(.5,G.inner);gr.addColorStop(1,'#a3281f');
  c.fillStyle=gr;c.fill(P);c.save();c.clip(P);
  c.fillStyle=G.tongue;c.beginPath();
  if(mo.talking)c.ellipse(0,SAG+D*0.98,hw*0.5,D*0.42,0,0,Math.PI*2);else c.ellipse(hw*0.05,SAG+D*1.05,hw*0.62,D*0.5,0,0,Math.PI*2);
  c.fill();
  if(!mo.talking){c.fillStyle='rgba(255,170,60,.55)';c.beginPath();c.ellipse(hw*0.05,SAG+D*1.1,hw*0.45,D*0.3,0,0,Math.PI*2);c.fill();}
  c.restore();c.strokeStyle='rgba(70,8,10,.7)';c.lineWidth=Math.max(3,hw*0.02);c.stroke(P);c.restore();
}

/* ---- 눈 ---- */
function drawEye(c,E,idx,lid,M0){
  const p=st.p,es=p.es,[ecx,ecy]=[E.ell[0],354],rot=(E.ell[4]>90?E.ell[4]-180:E.ell[4])*Math.PI/180;
  const rx=E.ell[2]+0.5,fcy=343,fry=91.5;
  c.save();
  c.translate(ecx,ecy+p.rise[idx]);c.scale(es,es*(1+(es-1)*0.3));c.translate(-ecx,-ecy);
  const ell=()=>{c.beginPath();c.ellipse(E.ell[0],fcy,rx,fry,rot,0,Math.PI*2);};
  ell();c.save();c.clip();
  // 흰자
  const g=c.createLinearGradient(0,252,0,434);g.addColorStop(0,'#fdfdfd');g.addColorStop(.7,'#f6f6f6');g.addColorStop(1,'#e6e6e6');c.fillStyle=g;c.fillRect(E.ell[0]-90,240,180,210);
  // 눈동자
  const P=E.pupil,ps=p.ps,pcx=P[0]+p.px*(idx?1:1),pcy=P[1]+p.py;
  c.fillStyle='#151414';c.beginPath();c.ellipse(pcx,pcy,P[2]*ps*1.02,P[3]*ps*1.02,0,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';c.beginPath();c.ellipse(pcx+(E.hl[0]-P[0])*ps,pcy+(E.hl[1]-P[1])*ps,E.hl[2]*ps,E.hl[2]*ps*1.05,0,0,Math.PI*2);c.fill();
  // 눈꺼풀(위)
  const T=E.top.map(q=>[q[0],q[1]+lid+p.slope*((idx===0?(E.ell[0]-q[0]):(q[0]-E.ell[0]))/rx)]);
  const gx=E.ell[0];
  c.beginPath();c.moveTo(gx-rx-8,T[0][1]);
  T.forEach(q=>c.lineTo(q[0],q[1]));c.lineTo(gx+rx+8,T[T.length-1][1]);c.lineTo(gx+rx+8,200);c.lineTo(gx-rx-8,200);c.closePath();
  const lg=c.createLinearGradient(0,220,0,T[5][1]+4);lg.addColorStop(0,G.lid0);lg.addColorStop(1,G.lid1);c.fillStyle=lg;c.fill();
  c.restore(); // clip 해제(타원)
  // 가려주기: 머리 바탕 그림을 눈 위에 다시 덮어 깜빡임/웃는 눈 만들기
  const cover=(pathFn)=>{c.save();c.beginPath();c.ellipse(E.ell[0],fcy,rx+2.5,fry+2.5,rot,0,Math.PI*2);c.clip();pathFn();c.clip();c.setTransform(M0);c.drawImage(IMG,0,0);c.restore();};
  const b=st.blink; if(b<0.98) cover(()=>{c.beginPath();c.rect(E.ell[0]-100,200,200,(1-b)*270);});
  if(p.sq>0.02){const sq=p.sq; cover(()=>{c.beginPath();c.moveTo(E.ell[0]-100,460);c.lineTo(E.ell[0]-100,426-sq*100);
      for(let i=0;i<=20;i++){const u=-1+i/10,x=u*100,uu=x/rx;c.lineTo(E.ell[0]+x,426-sq*100-sq*40*Math.max(0,1-uu*uu));}
      c.lineTo(E.ell[0]+100,426-sq*100);c.lineTo(E.ell[0]+100,460);c.closePath();});}
  c.restore();
}


function drawTears(c){
  const p=st.p; if(p.tear<0.03)return; const a=p.tear;
  [G.eyes.L,G.eyes.R].forEach((E,idx)=>{
    const cx=E.ell[0],sg=idx?1:-1;
    // 눈에 고인 물
    c.save();c.beginPath();c.ellipse(cx,E.ell[1]+66,E.ell[2]*0.78,13,0,0,Math.PI*2);c.fillStyle='rgba(150,215,255,'+(0.6*a)+')';c.fill();
    c.beginPath();c.ellipse(cx-sg*14,E.ell[1]+62,E.ell[2]*0.28,3.5,0,0,Math.PI*2);c.fillStyle='rgba(255,255,255,'+(0.85*a)+')';c.fill();c.restore();
    // 볼을 타고 내리는 눈물
    for(let j=0;j<2;j++){
      const ph=(T*0.5+j*0.5+idx*0.27)%1, y=E.ell[1]+70+ph*92, x=cx+sg*(46+ph*10);
      const al=Math.sin(Math.PI*ph)*a;
      c.save();c.globalAlpha=al;
      c.strokeStyle='rgba(150,215,255,.45)';c.lineWidth=7;c.lineCap='round';c.beginPath();c.moveTo(cx+sg*44,E.ell[1]+66);c.lineTo(x,y-12);c.stroke();
      c.beginPath();c.moveTo(x,y-16);c.quadraticCurveTo(x+11,y+3,x,y+11);c.quadraticCurveTo(x-11,y+3,x,y-16);
      c.fillStyle='rgba(160,220,255,.95)';c.fill();c.strokeStyle='rgba(80,160,225,.8)';c.lineWidth=2;c.stroke();
      c.fillStyle='#fff';c.beginPath();c.ellipse(x-3,y,2.5,4,0,0,Math.PI*2);c.fill();c.restore();
    }
  });
}

/* ---- 소리 ---- */
let AC=null,cur=null,playing=null; const BUF={};
function b64(d){const s=atob(d.split(',')[1]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
async function loadAudio(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')await AC.resume();
  for(const id in CL) if(!BUF[id]) BUF[id]=await AC.decodeAudioData(b64(CL[id].audio));}
const CL=window.CLIPS;
let T=0,playStart=0,endTimer=null;
async function play(btn){
  const spec=BTN[btn];
  clearTimeout(endTimer); setExpr(spec.ex);
  document.querySelectorAll('.btns button').forEach(b=>b.classList.toggle('on',b.dataset.k===btn));
  if(!spec.clip){$('who').textContent='규리';$('line').textContent='(대사 없음)';endTimer=setTimeout(back,spec.ex==='cry'?4500:2200);return;}
  await loadAudio();
  const c=CL[spec.clip];$('who').textContent='규리';$('line').textContent=c.text;
  if(cur){try{cur.stop()}catch(e){}}
  const s=AC.createBufferSource();s.buffer=BUF[spec.clip];s.connect(AC.destination);
  setTimeout(()=>{},0);
  playStart=AC.currentTime+0.35;s.start(playStart);cur=s;playing=c;
  s.onended=()=>{if(cur===s){playing=null;endTimer=setTimeout(back,1000)}};
}
function back(){setExpr('neutral');playing=null;document.querySelectorAll('.btns button').forEach(b=>b.classList.remove('on'));$('line').innerHTML='&nbsp;';$('who').innerHTML='&nbsp;';}
function setExpr(n){st.cur=n;if(n==='surprise')st.pop=1;}
const BTN={
 neutral:{label:'기본',sub:'기본 표정',ex:'neutral'},
 smile:{label:'웃는 얼굴',sub:'대사 없음',ex:'smile'},
 surprise:{label:'놀람',sub:'Wow, really?',ex:'surprise',clip:'wow'},
 curious:{label:'궁금',sub:'Wow, tell me more',ex:'curious',clip:'more'},
 cry:{lidL:5,lidR:5,slope:20,es:1,ps:1.14,px:0,py:6,sq:0,rise:[0,0],mouth:{hw:0.55,dp:0.3,sag:-32,rd:0,oy:34},tilt:0,bob:0,pop:0,tear:1},
 cry:{label:'울음',sub:'대사 없음',ex:'cry'},
 praise:{label:'칭찬',sub:'Excellent!',ex:'praise',clip:'ok1'}
};
const bw=$('btns');
for(const k in BTN){const b=document.createElement('button');b.type='button';b.dataset.k=k;b.disabled=true;b.innerHTML=BTN[k].label+'<small>'+BTN[k].sub+'</small>';if(BTN[k].wide)b.className='wide';
  b.onclick=()=>k==='neutral'?(clearTimeout(endTimer),back()):play(k);bw.appendChild(b);}
function enable(){bw.querySelectorAll('button').forEach(b=>b.disabled=false);}

/* ---- 그리기 루프 ---- */
let last=performance.now();
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!window.__gifmode)frame(dt,(playing&&AC)?AC.currentTime-playStart:null);
  requestAnimationFrame(tick);
}
function frame(dt,ts){
  T+=dt;
  stepExpr();
  let speaking=false,o=0,w=1;
  if(playing&&ts!==null){const t=ts;if(t>=0&&t<=playing.dur+0.05){const v=visAt(playing,t);speaking=true;o=v.o;w=v.w;
      const f=t/playing.fr,i=Math.floor(f),a=playing.env[i]||0,b2=playing.env[i+1]||0;o*=0.55+0.45*Math.min(1,(a+(b2-a)*(f-i))*1.6);}}
  mouthStep(o,w,speaking);
  if(T>st.blinkAt){const p=(T-st.blinkAt)/0.14;st.blink=p<1?Math.max(0.08,Math.abs(1-2*p)):1;if(p>=1)st.blinkAt=T+2.2+Math.random()*2.4;}
  st.pop*=0.9;
  if(!window.__gifmode){const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1),ww=Math.round(r.width*d),hh=Math.round(r.height*d);if(ww&&hh&&(cv.width!==ww||cv.height!==hh)){cv.width=ww;cv.height=hh;}}
  const W=cv.width,H=cv.height,c=ctx;c.setTransform(1,0,0,1,0,0);c.fillStyle='#fff';c.fillRect(0,0,W,H);
  if(ready){
    const sc=Math.min(H/(G.h*1.06),W/(G.w*1.02))*G.fit, px=G.pivot[0],py=G.pivot[1];
    const bob=Math.abs(Math.sin(T*7))*st.p.bob*H*0.012, popS=1+st.pop*0.05*Math.sin(Math.min(1,st.pop)*3);
    c.translate(W/2,H*G.anchorY-bob-st.pop*H*0.02);c.rotate(st.p.tilt+(speaking?Math.sin(T*6)*0.012:0)+Math.sin(T*17)*0.007*st.p.tear);
    c.scale(sc*popS*(1-(speaking?o*0.012:0)),sc*popS*(1+(speaking?o*0.02:0)));c.translate(-px,-py);
    c.drawImage(IMG,0,0);
    const M0=c.getTransform();
    drawEye(c,G.eyes.L,0,st.p.lidL,M0);drawEye(c,G.eyes.R,1,st.p.lidR,M0);
    drawTears(c);drawMouth(c);
  }
}
requestAnimationFrame(tick);
window.__gif={frame:(dt,ts,ex,clip)=>{if(ex!==st.cur)setExpr(ex);playing=clip?CL[clip]:null;frame(dt,ts);},ready:()=>ready};
})();
</script>
