<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>body{margin:0}[hidden]{display:none!important}</style><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-title" content="규리 영어"><meta name="mobile-web-app-capable" content="yes"></head><body>
<title>베이비 리그 영어 대화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one full-height video-call screen. White stage with two characters, child's camera tile top-right, caption and parent controls docked at the bottom. */
:root{
  --bg:#ffffff; --ink:#26303a; --muted:#7a8590; --line:#e6eaee; --soft:#f4f6f8;
  --accent:#ff7a45; --accent-ink:#ffffff; --hl:#2f8cff; --ok:#1f9d55; --rec:#e5484d;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;padding-block:10px 14px;box-sizing:border-box;gap:10px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.bar h1{font-family:var(--display);font-weight:400;font-size:17px;margin:0;white-space:nowrap}
.rec{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rec i{width:9px;height:9px;border-radius:50%;background:#cfd5db}
.rec.on{color:var(--rec)} .rec.on i{background:var(--rec);animation:pulse 1s infinite}
.ghost{font-family:var(--body);font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.stage{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--bg)}
#cv{background:var(--bg);position:absolute;inset:0;width:100%;height:100%;display:block}
.pip{position:absolute;right:10px;top:10px;width:27%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--soft);border:2px solid #fff;box-shadow:0 2px 10px rgba(30,40,50,.18);display:grid;place-items:center}
.pip video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.pip span{font-size:11px;color:var(--muted);text-align:center;padding:6px;line-height:1.35}
.tag{position:absolute;left:10px;top:10px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.9);padding:4px 8px;border-radius:8px;border:1px solid var(--line)}
.listen{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-size:14px;padding:9px 15px;border-radius:999px;white-space:nowrap;max-width:92%}
.listen b{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite;flex:none}
.listen em{font-style:normal;color:#ffd7c4;overflow:hidden;text-overflow:ellipsis}
.cap{min-height:3.1em;display:flex;flex-direction:column;align-items:center;gap:2px}
.who{font-size:12px;color:var(--muted)}
.line{font-family:var(--display);font-size:clamp(22px,6.2vw,28px);line-height:1.3;text-align:center;text-wrap:balance;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .3em}
.line span{color:#bcc4cb;transition:color .08s}
.line span.said{color:var(--ink)} .line span.now{color:var(--hl)}
.parent{display:flex;gap:8px}
.parent button{flex:1;font-family:var(--display);font-size:17px;border-radius:14px;padding:12px 10px;cursor:pointer;border:0}
.btn-ok{background:var(--ok);color:#fff}
.btn-retry{background:var(--soft);color:var(--ink);border:1px solid var(--line)!important}
.parent button:disabled{opacity:.35;cursor:default}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:0;min-height:1.2em}
button:focus-visible,.ghost:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
/* overlays */
.sheet{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:24px;overflow:auto;z-index:5}
.card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;text-wrap:balance}
.card p{margin:0;line-height:1.6;color:var(--ink)}
.card .small{font-size:13px;color:var(--muted)}
.name{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px}
.name label{font-size:13px;color:var(--muted)}
.name input{flex:1;min-width:0;border:0;font-family:var(--display);font-size:20px;color:var(--ink);background:transparent}
.steps{margin:0;padding-left:1.2em;line-height:1.8;font-size:14px}
.primary:disabled,.secondary:disabled{opacity:.5;cursor:default}
.primary{font-family:var(--display);font-size:20px;border:0;border-radius:16px;padding:15px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.secondary{font-family:var(--display);font-size:17px;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--bg);color:var(--ink);cursor:pointer}
.err{color:var(--rec);font-size:13px;margin:0}
video.result{width:100%;max-height:52vh;border-radius:16px;background:#000}
.row{display:flex;gap:8px;flex-wrap:wrap} .row>*{flex:1}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.rec.on i,.listen b{animation:none}}
</style>

<div class="app">
  <div class="bar">
    <div class="rec" id="rec"><i></i><span id="recTxt">녹화 대기</span></div>
    <h1>영어 대화</h1>
    <button class="ghost" id="endBtn" type="button">끝내기</button>
  </div>
  <div class="stage">
    <canvas id="cv"></canvas>
        <div class="pip" id="pip"><span>아이 카메라</span></div>
    <div class="listen" id="listen" hidden><b></b><span id="listenTxt">아람이 차례예요</span><em id="heard"></em></div>
  </div>
  <div class="cap"><div class="who" id="who">&nbsp;</div><div class="line" id="line"></div></div>
  <div class="parent">
    <button class="btn-ok" id="okBtn" type="button" disabled>잘 대답했어요</button>
    <button class="btn-retry" id="retryBtn" type="button" disabled>다시 물어보기</button>
  </div>
  <p class="hint" id="hint"></p>
</div>

<div class="sheet" id="startSheet">
  <div class="card">
    <h2>영상통화처럼 영어로 대화해요</h2>
    <p>규리가 책에 나온 질문을 하면, 아이가 영어로 대답해요. 대화하는 모습은 영상으로 녹화돼요.</p>
    <div class="name"><label for="childName">아이 이름</label><input id="childName" value="아람" readonly></div>
    <ol class="steps">
      <li>휴대폰을 세워 두고 아이 얼굴이 보이게 해 주세요.</li>
      <li>카메라와 마이크 사용을 허용해 주세요.</li>
      <li>음성 인식이 잘 안 되면 아래의 <b>잘 대답했어요</b> 버튼을 눌러 주세요.</li>
    </ol>
    <button class="primary" id="startCam" type="button" disabled>캐릭터 불러오는 중…</button>
    <button class="secondary" id="startNoCam" type="button" disabled>녹화 없이 미리 해보기</button>
    <p class="err" id="startErr" hidden></p>
    <p class="small">시험판이에요. 대사는 예시예요. 이름 음성은 '아람'으로 미리 녹음되어 있어요.</p>
  </div>
</div>

<div class="sheet" id="endSheet" hidden>
  <div class="card">
    <h2 id="endTitle">오늘 대화 끝!</h2>
    <video class="result" id="result" controls playsinline hidden></video>
    <p id="endMsg"></p>
    <div class="row" id="saveRow" hidden>
      <button class="primary" id="saveBtn" type="button">영상 저장</button>
      <button class="secondary" id="shareBtn" type="button" hidden>공유하기</button>
    </div>
    <button class="secondary" id="againBtn" type="button">처음부터 다시</button>
  </div>
</div>

<script>
(function(){
'use strict';
const CLIPS=window.CLIPS;

/* ===== 1. 대화 대본 (책 내용으로 바꿀 부분) =====
   say: 캐릭터가 하는 말 (미리 녹음된 클립 id)
   expect: 정답으로 인정할 단어들 (영어, 소문자)
   ok: 정답일 때 반응 / retry: 다시 물어볼 때 */
const SCRIPT=[
  {say:'q1', expect:['red','blue','yellow','green','pink','purple','orange','white','black','brown','rainbow'], ok:'ok1', retry:'retry1'},
  {say:'q2', expect:['happy','good','fine','great','okay','ok','sad','tired','hungry','sleepy','excited'], ok:'ok2', retry:'retry2'},
  {say:'bye'}
];
const GESTURE={q1:'hi',ok1:'cheer',retry1:'ask',q2:'ask',ok2:'cheer',retry2:'ask',bye:'wave'};
const NAMES={A:'규리'};
const PRAISE_DELAY=700; // 아이가 말을 마친 뒤 칭찬까지 쉬는 시간(ms)
const END_SILENCE=900; // 정답 단어가 들린 뒤, 이만큼 조용하면 말이 끝난 것으로 봄(ms)
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SOUNDALIKE={read:'red',rad:'red',blew:'blue',blu:'blue',yello:'yellow',okay:'okay','o.k.':'ok',fun:'fine',find:'fine',grape:'great'};
const LISTEN_MS=8000;

/* ===== 2. 화면 요소 ===== */
const $=id=>document.getElementById(id);
const lineEl=$('line'),whoEl=$('who'),listenEl=$('listen'),heardEl=$('heard'),hintEl=$('hint');
const okBtn=$('okBtn'),retryBtn=$('retryBtn'),recEl=$('rec'),recTxt=$('recTxt');

/* ===== 3. 2D 캐릭터 (본사 일러스트 + 캔버스로 그리는 입) ===== */
const cv=$('cv'), ctx=cv.getContext('2d');
const G2=window.GYURI2D; // 그림, 입/눈 위치, 색
const IMG=new Image();
let charsReady=0;
function onCharReady(){charsReady=1;const b=$('startCam'),n=$('startNoCam');b.disabled=n.disabled=false;b.textContent='카메라 켜고 시작하기';}
function loadFail(){$('startErr').hidden=false;$('startErr').textContent='캐릭터 그림을 불러오지 못했어요. 페이지를 새로고침해 주세요.';}
IMG.onload=onCharReady; IMG.onerror=loadFail; IMG.src=G2.img;
const M=G2.mouth, MX=(M.x0+M.x1)/2, MY=(M.y0+M.y1)/2, MANG=Math.atan2(M.y1-M.y0,M.x1-M.x0), MHW=Math.hypot(M.x1-M.x0,M.y1-M.y0)/2;
const KIDS={A:{kind:'2d',x:0,g:{wave:0,cheer:0,tilt:0,brow:0,hop:0},dp:1,hw:1,rd:0,env:0,talking:false,blinkAt:1.5,blink:1}};

/* 입모양: [벌어짐, 너비] (0~1 비율) */
const V={REST:[0.02,1.0],MBP:[0.0,0.85],AA:[1.0,1.05],E:[0.42,1.35],O:[0.7,0.7],U:[0.48,0.6],KK:[0.45,1.0],DD:[0.32,1.08],R:[0.38,0.78],FV:[0.12,1.0],SH:[0.3,0.72],SS:[0.15,1.18]};
function visAt(c,t){
  const k=c.keys; let i=-1;
  for(let j=0;j<k.length;j++){if(k[j][0]<=t)i=j;else break;}
  if(i<0) return {o:V.REST[0],w:V.REST[1],n:'REST'};
  const cur=V[k[i][1]],nx=k[i+1]; let o=cur[0],w=cur[1];
  if(nx){const lead=0.06,x=Math.min(1,Math.max(0,(t-(nx[0]-lead))/lead)),s=x*x*(3-2*x),n=V[nx[1]];o+=(n[0]-o)*s;w+=(n[1]-w)*s;}
  return {o,w,n:k[i][1]};
}
function envAt(c,t){const f=t/c.fr,i=Math.floor(f),a=c.env[i]||0,b=c.env[i+1]||0;return a+(b-a)*(f-i);}
function mouthTarget(k,o,w,speaking){
  k.talking=speaking;
  let dp=1,hw=1,rd=0; // 쉴 때: 원래 그림의 웃는 입 그대로
  if(speaking){dp=0.1+1.15*o;hw=Math.min(1.05,Math.max(0.5,0.3+0.6*w));rd=w<0.8?Math.min(1,(0.8-w)/0.2):0;}
  k.dp+=(dp-k.dp)*0.55;k.hw+=(hw-k.hw)*0.5;k.rd+=(rd-k.rd)*0.4;
}
function drawMouth(c,k){
  const hw=MHW*k.hw, D=M.depth*k.dp, rd=k.rd, N=40;
  c.save(); c.translate(MX,MY); c.rotate(MANG);
  const SAG=(M.sag||0)*k.hw, top=u=>-0.02*hw*Math.pow(u,4)+ rd*D*0.4*(1-u*u)*-1 + SAG*(1-u*u);
  const bot=u=>top(u)+ D*Math.sqrt(Math.max(0,1-u*u));
  if(D<5){ // 다문 입: 웃는 선
    c.beginPath();for(let i=0;i<=N;i++){const u=-1+2*i/N,x=u*hw,y=-0.02*hw*Math.pow(u,4)+Math.max(4,hw*0.05)*(1-u*u)+SAG*(1-u*u);i?c.lineTo(x,y):c.moveTo(x,y);}
    c.strokeStyle=G2.inner;c.lineWidth=Math.max(4,hw*0.07);c.lineCap='round';c.stroke();c.restore();return;
  }
  const P=new Path2D();
  for(let i=0;i<=N;i++){const u=-1+2*i/N;const x=u*hw,y=top(u);i?P.lineTo(x,y):P.moveTo(x,y);}
  for(let i=N;i>=0;i--){const u=-1+2*i/N;P.lineTo(u*hw,bot(u));}
  P.closePath();
  const gr=c.createLinearGradient(0,0,0,D);gr.addColorStop(0,'#5e0d12');gr.addColorStop(0.5,G2.inner);gr.addColorStop(1,'#a3281f');
  c.fillStyle=gr;c.fill(P);
  c.save();c.clip(P);
  if(k.talking){c.fillStyle=G2.tongue;c.beginPath();c.ellipse(0,D*0.98,hw*0.5,D*0.42,0,0,Math.PI*2);c.fill();}
  else{c.fillStyle=G2.tongue;c.beginPath();c.ellipse(hw*0.05,D*1.05,hw*0.62,D*0.5,0,0,Math.PI*2);c.fill();
       c.fillStyle='rgba(255,170,60,.55)';c.beginPath();c.ellipse(hw*0.05,D*1.1,hw*0.45,D*0.3,0,0,Math.PI*2);c.fill();}
  c.restore();
  c.strokeStyle='rgba(70,8,10,.7)';c.lineWidth=Math.max(2,hw*0.025);c.stroke(P);
  c.restore();
}
function drawEyelids(c,k){
  const s=k.blink; if(s>=0.999)return;
  const ang=G2.ang*Math.PI/180;
  G2.eyes.forEach(e=>{c.save();c.translate(e.cx,e.cy);c.rotate(ang);
    c.beginPath();c.ellipse(0,0,e.rx+3,e.ry+3,0,0,Math.PI*2);c.clip();
    const hgt=(1-s)*(e.ry*2+8); c.fillStyle=G2.skin; c.fillRect(-e.rx-6,-e.ry-6,e.rx*2+12,hgt);
    c.restore();});
}

/* ===== 4. 소리 (Web Audio: 재생 시각이 정확하고, 녹화에도 섞을 수 있음) ===== */
let AC=null,outGain=null,recDest=null;const BUF={};
function b64ToBuf(d){const s=atob(d.split(',')[1]);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
async function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  outGain=AC.createGain(); outGain.connect(AC.destination);
  recDest=AC.createMediaStreamDestination(); outGain.connect(recDest);
  await Promise.all(Object.keys(CLIPS).map(id=>new Promise((res,rej)=>AC.decodeAudioData(b64ToBuf(CLIPS[id].audio),b=>{BUF[id]=b;res();},rej))));
  if(AC.state==='suspended') await AC.resume();
}
let cur=null; // 지금 말하는 클립
function play(id){
  return new Promise(res=>{
    const c=CLIPS[id]; const src=AC.createBufferSource(); src.buffer=BUF[id]; src.connect(outGain);
    const start=AC.currentTime+0.06; src.start(start);
    cur={id,c,kid:KIDS[c.ch],start,g:GESTURE[id]};
    showCaption(c);
    src.onended=()=>{cur=null;markAllSaid();setTimeout(res,180);};
  });
}

/* ===== 5. 자막 ===== */
let wordEls=[];
function showCaption(c){
  whoEl.textContent=NAMES[c.ch]; lineEl.textContent='';
  wordEls=c.words.map(w=>{const s=document.createElement('span');s.textContent=w[0];lineEl.appendChild(s);return s;});
}
function markAllSaid(){wordEls.forEach(e=>e.className='said');}

/* ===== 6. 아이 대답 듣기 ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let srWorks=!!SR, pending=null;
function norm(s){return s.toLowerCase().replace(/[^a-z.\s]/g,' ').split(/\s+/).filter(Boolean).map(w=>SOUNDALIKE[w]||w);}
function matchAns(t,expect){return norm(t).find(w=>expect.includes(w));}
/* 음성 인식기는 시작할 때 한 번만 켜서 대화가 끝날 때까지 계속 켜 둠.
   (질문마다 새로 켜면 안드로이드에서 마이크 허용 창·알림음이 반복됨)
   아이 차례가 아닐 때 들린 말(규리 목소리 포함)은 버림 */
let recog=null,micOn=false,listener=null,resLen=0,fastEnds=0,recStartedAt=0;
function micStart(){
  if(!srWorks||micOn)return;
  micOn=true;
  recog=new SR(); recog.lang='en-US'; recog.interimResults=true; recog.maxAlternatives=5; recog.continuous=true;
  recog.onresult=e=>{resLen=e.results.length;fastEnds=0;if(listener)listener(e);};
  recog.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){srWorks=false;micOn=false;if(listener)listener(null);}};
  recog.onend=()=>{
    resLen=0;
    if(!micOn)return;
    // 켜자마자 바로 꺼지는 일이 계속되면 포기 (무한 재시작 방지)
    if(performance.now()-recStartedAt<1000&&++fastEnds>=5){srWorks=false;micOn=false;if(listener)listener(null);return;}
    setTimeout(micKick,250);
  };
  micKick();
}
function micKick(){
  if(!micOn)return;
  recStartedAt=performance.now();
  try{recog.start();}catch(e){}
}
function micStop(){micOn=false;listener=null;try{recog&&recog.abort();}catch(e){}}
function listen(expect){
  return new Promise(resolve=>{
    let done=false,timer=null,quiet=null,got=null;
    const finish=r=>{if(done)return;done=true;clearTimeout(timer);clearTimeout(quiet);listener=null;pending=null;listenEl.hidden=true;okBtn.disabled=retryBtn.disabled=true;resolve(r);};
    pending=finish; heardEl.textContent=''; listenEl.hidden=false; okBtn.disabled=retryBtn.disabled=false;
    $('listenTxt').textContent=$('childName').value+'이 차례예요';
    const noSR=()=>{clearTimeout(timer);hintEl.textContent='이 브라우저에서는 음성 인식을 쓸 수 없어요. 아이가 대답하면 버튼을 눌러 주세요.';};
    if(!srWorks){hintEl.textContent='아이가 대답하면 잘 대답했어요 버튼을 눌러 주세요.';return;}
    hintEl.textContent='듣고 있어요. 인식이 안 되면 버튼을 눌러 주세요.';
    timer=setTimeout(()=>finish({ok:false,timeout:true}),LISTEN_MS);
    // 지금 이 순간까지 쌓인 결과(규리가 말할 때 들린 것)는 무시
    let base=resLen;
    listener=e=>{
      if(!e){noSR();return;}
      if(e.results.length<base)base=0; // 인식기가 다시 켜져서 결과가 새로 시작됨
      for(let ri=Math.max(base,e.resultIndex);ri<e.results.length;ri++){const r=e.results[ri];for(let a=0;a<r.length;a++){const tx=r[a].transcript;if(a===0)heardEl.textContent='“'+tx.trim()+'”';const w=matchAns(tx,expect);if(w&&!got){got=w;}}
        if(got){heardEl.textContent='“'+got+'”';clearTimeout(timer);clearTimeout(quiet);
          if(r.isFinal){finish({ok:true,word:got});return;}
          quiet=setTimeout(()=>finish({ok:true,word:got}),END_SILENCE);}}
    };
    if(!micOn)micStart();
  });
}
okBtn.addEventListener('click',()=>pending&&pending({ok:true,by:'parent'}));
retryBtn.addEventListener('click',()=>pending&&pending({ok:false,action:'retry'}));

/* ===== 7. 대화 진행 ===== */
let running=false,stopReq=false;
async function runLesson(){
  running=true;stopReq=false;
  for(const step of SCRIPT){
    if(stopReq)break;
    await play(step.say);
    if(!step.expect)continue;
    let tries=0,r;
    while(!stopReq){
      r=await listen(step.expect);
      if(r.ok||r.stop)break;
      if(r.action==='retry'||tries===0){tries++;await play(step.retry);continue;}
      break;
    }
    if(stopReq)break;
    if(r&&r.ok){hintEl.textContent=r.word?'“'+r.word+'” 라고 대답했어요!':'';await sleep(PRAISE_DELAY);await play(step.ok);}
  }
  hintEl.textContent='';
  running=false;
  setTimeout(endSession,700);
}

/* ===== 8. 카메라 + 녹화 ===== */
let camStream=null,camVideo=null,mediaRec=null,chunks=[],recStart=0,recCanvas=null,rctx=null,recMime='',wakeLock=null;
async function openCamera(){
  camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:960}},audio:{echoCancellation:true,noiseSuppression:true}});
  camVideo=document.createElement('video'); camVideo.playsInline=true; camVideo.muted=true; camVideo.srcObject=camStream;
  const pip=$('pip'); pip.textContent=''; pip.appendChild(camVideo); await camVideo.play().catch(()=>{});
}
function pickMime(){
  const c=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  return c.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
}
function startRecording(){
  recCanvas=document.createElement('canvas'); recCanvas.width=720; recCanvas.height=1280; rctx=recCanvas.getContext('2d');
  drawRecFrame();
  const vs=recCanvas.captureStream(30);
  AC.createMediaStreamSource(camStream).connect(recDest); // 아이 목소리는 녹화에만, 스피커로는 안 나감
  const stream=new MediaStream([...vs.getVideoTracks(),...recDest.stream.getAudioTracks()]);
  recMime=pickMime(); chunks=[];
  mediaRec=new MediaRecorder(stream,recMime?{mimeType:recMime,videoBitsPerSecond:2500000}:undefined);
  mediaRec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  mediaRec.start(1000); recStart=performance.now(); recEl.classList.add('on');
}
function stopRecording(){
  return new Promise(res=>{if(!mediaRec||mediaRec.state==='inactive')return res(null);
    mediaRec.onstop=()=>res(new Blob(chunks,{type:mediaRec.mimeType||recMime||'video/webm'}));mediaRec.stop();recEl.classList.remove('on');});
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawRecFrame(){
  if(!rctx)return; const c=rctx,W=720,H=1280;
  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);
  // 캐릭터 영역
  const ar=cv.width/cv.height, bw=W, bh=Math.min(940,bw/ar), by=120+(940-bh)/2;
  try{c.drawImage(cv,0,by,bw,bh);}catch(e){}
  // 아이 카메라 (거울 모드)
  if(camVideo&&camVideo.videoWidth){
    const pw=220,ph=293,px=W-pw-28,py=36,vw=camVideo.videoWidth,vh=camVideo.videoHeight,s=Math.max(pw/vw,ph/vh),sw=pw/s,sh=ph/s;
    c.save();roundRect(c,px,py,pw,ph,24);c.clip();c.translate(px+pw,py);c.scale(-1,1);
    c.drawImage(camVideo,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,pw,ph);c.restore();
    c.lineWidth=5;c.strokeStyle='#ffffff';roundRect(c,px,py,pw,ph,24);c.stroke();
  }
  // 자막
  c.textAlign='center';c.fillStyle='#7a8590';c.font='28px "Gowun Dodum", sans-serif';
  c.fillText(whoEl.textContent.trim(),W/2,1110);
  c.font='54px Jua, sans-serif';
  const text=wordEls.map(e=>e.textContent).join(' ');
  const lines=[];let ln='';text.split(' ').forEach(w=>{const t=ln?ln+' '+w:w;if(c.measureText(t).width>W-80&&ln){lines.push(ln);ln=w;}else ln=t;});if(ln)lines.push(ln);
  c.fillStyle='#26303a';lines.slice(0,2).forEach((l,i)=>c.fillText(l,W/2,1180+i*64));
  c.textAlign='left';c.font='24px "Gowun Dodum", sans-serif';c.fillStyle='#9aa3ab';
  c.fillText(new Date().toLocaleDateString('ko-KR')+' · '+$('childName').value,28,64);
}

/* ===== 9. 애니메이션 루프 ===== */
const t0=performance.now(); const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function fit(){const r=cv.getBoundingClientRect();if(!r.width)return;const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);}
new ResizeObserver(fit).observe(cv); fit();
function ease(cur,to,k){return cur+(to-cur)*k;}
function tick(){
  const T=(performance.now()-t0)/1000;
  const k=KIDS.A, speaking=!!cur, t=cur?Math.max(0,AC.currentTime-cur.start):0;
  const br=reduce?0:Math.sin(T*2.2)*0.012;
  const g={wave:0,cheer:0,tilt:0,brow:0,hop:0};
  if(speaking){
    const v=visAt(cur.c,t),e=envAt(cur.c,t);let o=v.o;if(v.n!=='MBP'&&v.n!=='REST')o*=0.45+0.75*Math.min(1,e*1.3);
    mouthTarget(k,o,v.w,true);k.env=e;
    wordEls.forEach((el,i)=>{const w=cur.c.words[i];el.className=t>=w[2]?'said':(t>=w[1]?'now':'');});
    const D=cur.c.dur;
    if(cur.g==='hi'&&t<1.1)g.wave=1;
    if(cur.g==='wave')g.wave=1;
    if(cur.g==='ask'||cur.g==='hi'){if(t>D-0.9){g.tilt=1;g.brow=1;}}
    if(cur.g==='cheer'){g.cheer=1;g.hop=Math.abs(Math.sin(t*Math.PI*2.4))*(t<D?1:0);g.brow=0.6;}
  }else{mouthTarget(k,0,1,false);k.env=0;}
  if(pending){g.tilt=1;g.brow=0.6;}
  for(const n in g)k.g[n]=ease(k.g[n],g[n],0.15);
  const G=k.g;
  if(T>k.blinkAt){const p=(T-k.blinkAt)/0.14;k.blink=p<1?Math.max(0.08,Math.abs(1-2*p)):1;if(p>=1)k.blinkAt=T+2.2+Math.random()*2.4;}
  // ---- 그리기 ----
  const W=cv.width,Hh=cv.height,c=ctx;
  c.setTransform(1,0,0,1,0,0);c.fillStyle='#ffffff';c.fillRect(0,0,W,Hh);
  if(IMG.complete&&IMG.naturalWidth){
    const talk=speaking?k.env:0, sq=talk*0.03+br*1.2;
    // 상반신 위주로: 그림 높이의 78%가 화면에 꽉 차게, 아래를 조금 잘라냄
    const sc=Math.min(Hh/(G2.h*1.06),W/(G2.w*1.02))*(G2.fit||1);
    const px=G2.pivot[0],py=G2.pivot[1];
    c.translate(W/2,Hh*(G2.anchorY||0.97)-G.hop*Hh*0.05);
    c.rotate(G.tilt*0.07+G.wave*Math.sin(T*9)*0.05);
    c.scale(sc*(1-sq*0.5),sc*(1+sq));
    c.translate(-px,-py);
    c.drawImage(IMG,0,0);
    drawMouth(c,k); drawEyelids(c,k);
  }
  if(mediaRec&&mediaRec.state==='recording'){drawRecFrame();const s=Math.floor((performance.now()-recStart)/1000);recTxt.textContent='녹화 중 '+String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ===== 10. 시작 / 끝 ===== */
let lastBlobUrl=null,lastBlob=null;
async function begin(withCam){
  const err=$('startErr'); err.hidden=true;
  try{
    if(withCam){
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)throw new Error('nodev');
      await openCamera();
    }
    await initAudio();
  }catch(e){
    err.hidden=false;
    err.textContent=e&&e.message==='nodev'?'이 화면에서는 카메라 녹화를 쓸 수 없어요. 녹화 없이 미리 해보기를 눌러 주세요.':'카메라나 마이크 허용이 거절됐어요. 브라우저 설정에서 허용한 뒤 다시 눌러 주세요. 녹화 없이 해볼 수도 있어요.';
    if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
    return;
  }
  $('startSheet').hidden=true;
  try{wakeLock=await navigator.wakeLock?.request('screen');}catch(e){}
  if(camStream){try{startRecording();}catch(e){hintEl.textContent='녹화를 시작하지 못했어요. 대화는 계속할 수 있어요.';}}
  else recTxt.textContent='녹화 없음 (미리보기)';
  micStart(); // 마이크 허용은 여기서 한 번만
  runLesson();
}
$('startCam').addEventListener('click',()=>begin(true));
$('startNoCam').addEventListener('click',()=>begin(false));
$('endBtn').addEventListener('click',()=>{if(!running){endSession();return;}stopReq=true;if(pending)pending({stop:true});});

async function endSession(){
  if($('endSheet').hidden===false)return;
  micStop();
  const blob=await stopRecording();
  try{wakeLock&&wakeLock.release();}catch(e){}
  const vid=$('result'),msg=$('endMsg');
  if(blob&&blob.size){
    lastBlob=blob; if(lastBlobUrl)URL.revokeObjectURL(lastBlobUrl); lastBlobUrl=URL.createObjectURL(blob);
    vid.src=lastBlobUrl; vid.hidden=false; $('saveRow').hidden=false;
    msg.textContent='녹화된 영상을 확인하고 저장하거나 공유해 보세요.';
    const f=new File([blob],fileName(),{type:blob.type});
    $('shareBtn').hidden=!(navigator.canShare&&navigator.canShare({files:[f]}));
  }else{vid.hidden=true;$('saveRow').hidden=true;msg.textContent=camStream?'녹화된 영상이 없어요.':'미리보기라서 녹화는 하지 않았어요.';}
  $('endSheet').hidden=false;
}
function fileName(){const d=new Date(),p=n=>String(n).padStart(2,'0');const ext=(lastBlob&&lastBlob.type.includes('mp4'))?'mp4':'webm';
  return $('childName').value+'_영어대화_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+'.'+ext;}
$('saveBtn').addEventListener('click',()=>{const a=document.createElement('a');a.href=lastBlobUrl;a.download=fileName();document.body.appendChild(a);a.click();a.remove();});
$('shareBtn').addEventListener('click',async()=>{try{await navigator.share({files:[new File([lastBlob],fileName(),{type:lastBlob.type})],title:'영어 대화 영상'});}catch(e){}});
$('againBtn').addEventListener('click',()=>{location.reload();});
})();
</script>
